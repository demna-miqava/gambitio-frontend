<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="description"
      content="Play chess online with friends on Gambitio. Analyze your games, solve puzzles, track your rating and improve your skills."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="icon" type="image/png" href="/favicon.png?v=3" />
    <link rel="apple-touch-icon" href="/logo-mark.png?v=3" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- Follows the in-app theme: set by the script below, then by ThemeColorMeta -->
    <meta name="theme-color" content="#f6f3ea" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,400..700,0,0;1,9..144,400..700,0,0&family=Instrument+Sans:wdth,wght@75..100,400..700&display=swap"
      rel="stylesheet"
    />
    <title>Gambitio</title>
    <script>
      // Apply the saved (or system) theme and palette before first paint to avoid a flash
      (function () {
        try {
          var stored = JSON.parse(localStorage.getItem("theme"));
          var dark =
            stored === "dark" ||
            (stored !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
          // Page backgrounds per palette, as in src/constants/palettes.ts
          var backgrounds = {
            emerald: ["#f6f3ea", "#07130f"],
            club: ["#f6f2ea", "#13100d"],
            midnight: ["#f5f2ec", "#0b101b"],
            walnut: ["#f9f1e9", "#160f0b"],
            ink: ["#f7f6f3", "#1c1a18"],
            fjord: ["#f0f4f8", "#0a1119"],
            plum: ["#faf0f0", "#160d13"],
            tide: ["#f7f2e8", "#061316"],
            olive: ["#f5f3e8", "#10110a"],
          };
          var palette = JSON.parse(localStorage.getItem("palette"));
          if (!Object.prototype.hasOwnProperty.call(backgrounds, palette)) palette = "emerald";
          document.documentElement.dataset.palette = palette;
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", backgrounds[palette][dark ? 1 : 0]);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

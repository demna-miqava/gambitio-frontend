<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="description"
      content="Play chess online with friends on Gambitio. Analyze your games, solve puzzles, track your rating and improve your skills."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="icon" type="image/png" href="/favicon.png?v=3" />
    <link rel="apple-touch-icon" href="/logo-mark.png?v=3" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- Follows the in-app theme: set by the script below, then by ThemeColorMeta -->
    <meta name="theme-color" content="#f4f4f4" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Self-hosted fonts (src/assets/fonts/fonts.css): the latin files the first screen uses -->
    <link
      rel="preload"
      href="/src/assets/fonts/hanken-grotesk-latin-variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/src/assets/fonts/besley-latin-variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Gambitio</title>
    <!-- Apply the saved (or system) theme and palette before first paint to
         avoid a flash. Synchronous on purpose (no async/defer/module), and a
         file rather than inline so the CSP needs no script hash -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
